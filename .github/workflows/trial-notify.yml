name: Trial Request Notification

on:
  issues:
    types: [opened, labeled]

jobs:
  notify:
    if: github.event.label.name == 'trial-request'
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TITLE="${{ github.event.issue.title }}"
          BODY="${{ github.event.issue.body }}"
          URL="${{ github.event.issue.html_url }}"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="🔔 NEW TRIAL REQUEST: ${TITLE}

${BODY}

🔗 ${URL}" \
            -d parse_mode="Markdown"

      - name: Auto-assign to owner
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              assignees: ['denis0wn']
            })

      - name: Add welcome comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: 'Thanks for requesting a DAK trial! 🎉\n\nI\'ll review your use case and send you a personalized trial binary with license key within 2 hours.\n\nIn the meantime, you can:\n- Try the **Tryss demo binary**: https://github.com/denis0wn/dak/releases/tag/v0.2.0\n- Read the **Quick Start**: https://github.com/denis0wn/dak#quick-start-binary-download\n- Book a **30-min demo**: https://calendly.com/denis-smoliakov/dak-demo\n\nQuestions? Reply here or message @Myagentdenbot on Telegram.'
